# Cache-aware streaming FastConformer-Transducer with prompt support and dynamic per-locale
# data reweighting.  After each validation epoch the model computes per-locale WER and
# automatically updates the Lhotse shard weights so that weaker locales are sampled more
# heavily in the next training epoch.
#
# Inherits the full model architecture from the base streaming-prompt config; only the
# data and dynamic_weighting sections differ.
#
# Usage:
#   python examples/asr/asr_transducer/speech_to_text_rnnt_bpe_prompt.py \
#       --config-path conf/fastconformer/cache_aware_streaming \
#       --config-name fastconformer_transducer_bpe_streaming_prompt_dynamic_weighting \
#       model.train_ds.input_cfg.0.input_cfg.0.manifest_filepath=/data/en-US/manifest.json \
#       model.train_ds.input_cfg.0.input_cfg.0.tarred_audio_filepaths=/data/en-US/audio__OP_0..127_CL_.tar

name: "FastConformer-Transducer-BPE-Prompt-Streaming-DynWeight"

model:
  sample_rate: 16000
  compute_eval_loss: false
  log_prediction: true
  skip_nan_grad: false

  model_defaults:
    enc_hidden: ${model.encoder.d_model}
    pred_hidden: 640
    joint_hidden: 640
    initialize_prompt_feature: true
    num_prompts: 128
    norm: None
    prompt_dictionary: {
    'en-US': 0,
    'en': 0,
    'de-DE': 9,
    'de': 9,
    'es-ES': 2,
    'es': 2,
    'fr-FR': 8,
    'fr': 8,
    'auto': 101
    }

  # ---------------------------------------------------------------------------
  # Training data — one top-level group per locale so weights can be updated
  # independently by the dynamic weighting callback.
  #
  # The `tags.locale` value must exactly match the `name` field in the
  # corresponding validation_ds entry below.
  # ---------------------------------------------------------------------------
  train_ds:
    use_lhotse: true
    batch_duration: 400
    quadratic_duration: 15
    num_buckets: 30
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 39.99
    min_duration: 0.1
    bucket_buffer_size: 10000
    shuffle_buffer_size: 10000
    prompt_dictionary: ${model.model_defaults.prompt_dictionary}
    num_prompts: ${model.model_defaults.num_prompts}
    subsampling_factor: ${model.encoder.subsampling_factor}
    lang_field: target_lang
    prompt_mode_field: prompt_mode
    default_prompt_mode: unified
    unified_auto_ratio: 0.5
    # Temperature applied by Lhotse when normalising group weights;
    # matches dynamic_weighting.temperature below.
    reweight_temperature: 1.0

    input_cfg:
      # ---- English (en-US) ------------------------------------------------
      - type: group
        weight: 1.0          # updated at runtime by dynamic weighting; also the fallback
                              # baseline for the first-ever reweighting update and, for the
                              # filter strategy, the fixed source distribution
        tags:
          locale: en-US      # must match validation_ds name entry below
          prompt_mode: unified
        input_cfg:
          - type: nemo_tarred
            manifest_filepath: ???   # /data/en-US/manifest__OP_0..127_CL_.json
            tarred_audio_filepaths: ???  # /data/en-US/audio__OP_0..127_CL_.tar
            shuffle: true
            shard_seed: trng

      # ---- German (de-DE) -------------------------------------------------
      - type: group
        weight: 1.0
        tags:
          locale: de-DE
          prompt_mode: unified
        input_cfg:
          - type: nemo_tarred
            manifest_filepath: ???
            tarred_audio_filepaths: ???
            shuffle: true
            shard_seed: trng

      # ---- Spanish (es-ES) ------------------------------------------------
      - type: group
        weight: 1.0
        tags:
          locale: es-ES
          prompt_mode: unified
        input_cfg:
          - type: nemo_tarred
            manifest_filepath: ???
            tarred_audio_filepaths: ???
            shuffle: true
            shard_seed: trng

      # ---- French (fr-FR) -------------------------------------------------
      - type: group
        weight: 1.0
        tags:
          locale: fr-FR
          prompt_mode: unified
        input_cfg:
          - type: nemo_tarred
            manifest_filepath: ???
            tarred_audio_filepaths: ???
            shuffle: true
            shard_seed: trng

  # ---------------------------------------------------------------------------
  # Validation data — one entry per locale.
  #
  # The `name` field is used by NeMo's resolve_validation_dataloaders to
  # populate model._validation_names, which the dynamic weighting code reads
  # to map dataloader_idx → locale → training group weight.
  #
  # Each entry is passed to setup_validation_data separately, producing one
  # dataloader per locale and multi-dataloader validation epoch outputs.
  # ---------------------------------------------------------------------------
  validation_ds:
    manifest_filepath:
      - name: en-US
        manifest_filepath: ???   # /data/en-US/val.json
        sample_rate: ${model.sample_rate}
        batch_size: 8
        shuffle: false
        num_workers: 4
        pin_memory: true
        use_lhotse: true
        use_bucketing: false
        prompt_dictionary: ${model.model_defaults.prompt_dictionary}
        num_prompts: ${model.model_defaults.num_prompts}
        subsampling_factor: ${model.encoder.subsampling_factor}
        lang_field: target_lang
        default_lang: en-US
        initialize_prompt_feature: true

      - name: de-DE
        manifest_filepath: ???
        sample_rate: ${model.sample_rate}
        batch_size: 8
        shuffle: false
        num_workers: 4
        pin_memory: true
        use_lhotse: true
        use_bucketing: false
        prompt_dictionary: ${model.model_defaults.prompt_dictionary}
        num_prompts: ${model.model_defaults.num_prompts}
        subsampling_factor: ${model.encoder.subsampling_factor}
        lang_field: target_lang
        default_lang: de-DE
        initialize_prompt_feature: true

      - name: es-ES
        manifest_filepath: ???
        sample_rate: ${model.sample_rate}
        batch_size: 8
        shuffle: false
        num_workers: 4
        pin_memory: true
        use_lhotse: true
        use_bucketing: false
        prompt_dictionary: ${model.model_defaults.prompt_dictionary}
        num_prompts: ${model.model_defaults.num_prompts}
        subsampling_factor: ${model.encoder.subsampling_factor}
        lang_field: target_lang
        default_lang: es-ES
        initialize_prompt_feature: true

      - name: fr-FR
        manifest_filepath: ???
        sample_rate: ${model.sample_rate}
        batch_size: 8
        shuffle: false
        num_workers: 4
        pin_memory: true
        use_lhotse: true
        use_bucketing: false
        prompt_dictionary: ${model.model_defaults.prompt_dictionary}
        num_prompts: ${model.model_defaults.num_prompts}
        subsampling_factor: ${model.encoder.subsampling_factor}
        lang_field: target_lang
        default_lang: fr-FR
        initialize_prompt_feature: true

  # ---------------------------------------------------------------------------
  # Dynamic weighting — all options are optional; behaviour is a no-op when
  # enabled: false.
  # ---------------------------------------------------------------------------
  dynamic_weighting:
    enabled: true

    # ---- Strategy ----------------------------------------------------------
    # "rebuild" (default): updates input_cfg group weights and fully rebuilds
    #   the training DataLoader after each reweighting epoch.  Simple and exact;
    #   incurs ~30–60 s manifest re-indexing overhead per update.
    #
    # "filter": injects a per-locale rejection-sampling filter into the Lhotse
    #   CutSet pipeline once at startup.  Weight updates only write a small JSON
    #   file — no DataLoader rebuild or worker restart is needed.  Workers reload
    #   the file every filter_read_interval cuts.  Trade-off: some cuts are
    #   discarded (throughput reduced by 1 − min(acceptance_probs)).
    strategy: rebuild  # or: filter

    # Key inside each train_ds.input_cfg group's `tags` dict that names the locale.
    locale_tag: locale

    # Floor weight; prevents any locale from being completely starved.
    min_weight: 0.01

    # Optional absolute ceiling on any locale's weight (safety valve against unbounded
    # drift over very long training runs). null = unbounded.
    max_weight: null

    # ---- Scaling direction ---------------------------------------------------
    # Weights are updated *relative to peer locales*, not from each locale's absolute
    # WER value — see relative_stat/relative_sensitivity/max_update_ratio below.
    # "wer"         (default): upsamples locales whose WER is worse than their peers,
    #               giving them more training data to converge faster.
    # "inverse_wer": upsamples locales whose WER is better than their peers, to
    #               maintain their quality while the rest catches up.
    scale: wer

    # Reference statistic used to compare a locale's WER against its peers:
    # "median" (default; robust to one locale being an outlier) or "mean".
    relative_stat: median

    # Exponent applied to (locale_wer / reference_wer). 1.0 (default) reacts
    # proportionally to the relative gap; <1.0 dampens large gaps; >1.0 amplifies them.
    relative_sensitivity: 1.0

    # Per-update cap: a single reweighting cycle can change any locale's weight by at
    # most this multiplicative factor (e.g. 1.5 == at most +50%/-33% per update).
    # This is what keeps updates from being drastic — weights instead walk gradually
    # toward the WER-implied target over several update cycles. The new weight is
    # always `previous_weight * step_mult`, never recomputed from scratch.
    max_update_ratio: 1.5

    # EMA coefficient for smoothing WER across epochs before computing weights.
    #   0.0  — no smoothing (react immediately to each epoch's WER)
    #   0.3  — moderate smoothing (recommended starting point)
    #   0.7  — heavy smoothing (stable but slow to react)
    smoothing: 0.3

    # Lhotse's own static, config-time group-weight normalization (see
    # nemo.collections.common.data.lhotse.cutset.temperature_reweighting /
    # train_ds.reweight_temperature above). Independent of the relative-weighting
    # math above; currently unused by the dynamic-weighting update rule itself.
    temperature: 1.0

    # Reweight after every N validation epochs (set >1 to reduce noise from
    # single-epoch WER fluctuations).
    update_interval_epochs: 1

    # filter strategy only: workers re-read the acceptance prob file every N cuts.
    # Lower = more responsive to weight updates; higher = less file I/O overhead.
    filter_read_interval: 1000

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    num_workers: 8
    pin_memory: true
    use_lhotse: true
    use_bucketing: false
    prompt_dictionary: ${model.model_defaults.prompt_dictionary}
    num_prompts: ${model.model_defaults.num_prompts}
    subsampling_factor: ${model.encoder.subsampling_factor}
    lang_field: target_lang
    default_prompt_mode: langID

  tokenizer:
    dir: ???
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "NA"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 128
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 42
    d_model: 1024
    use_bias: false
    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: true
    reduction: null
    reduction_position: null
    reduction_factor: 1
    ff_expansion_factor: 4
    self_attention_model: rel_pos
    n_heads: 8
    att_context_size: [70, 6]
    att_context_probs: null
    att_context_style: chunked_limited
    xscaling: false
    untie_biases: true
    pos_emb_max_len: 5000
    conv_kernel_size: 9
    conv_norm_type: 'layer_norm'
    conv_context_size: causal
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1
    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1

  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true
    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 2
      t_max: null
      dropout: 0.2

  joint:
    _target_: nemo.collections.asr.modules.RNNTJoint
    log_softmax: null
    preserve_memory: false
    fuse_loss_wer: true
    fused_batch_size: 2
    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.2

  decoding:
    strategy: "greedy_batch"
    strip_lang_tags: true
    greedy:
      max_symbols: 10
    beam:
      beam_size: 2
      return_best_hypothesis: False
      score_norm: true
      tsd_max_sym_exp: 50
      alsd_max_target_len: 2.0

  interctc:
    loss_weights: []
    apply_at_layers: []

  loss:
    loss_name: "default"
    warprnnt_numba_kwargs:
      fastemit_lambda: 5e-3
      clamp: -1.0

  variational_noise:
    start_step: 0
    std: 0.0

  optim:
    name: adamw
    lr: 2.0
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    sched:
      name: NoamAnnealing
      d_model: ${model.encoder.d_model}
      warmup_steps: 10000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  max_epochs: -1
  max_steps: 500000
  val_check_interval: 0.5
  accelerator: auto
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  precision: bf16
  log_every_n_steps: 100
  enable_progress_bar: True
  num_sanity_val_steps: 0
  sync_batchnorm: true
  enable_checkpointing: False
  logger: false
  benchmark: false
  use_distributed_sampler: false
  limit_train_batches: 1000

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: True
  resume_if_exists: false
  resume_ignore_no_checkpoint: false
  create_wandb_logger: false
  wandb_logger_kwargs:
    name: null
    project: null
